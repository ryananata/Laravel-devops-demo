name: Clean Self-Hosted Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Sync to App Directory
        run: |
          echo "🚀 Memulai sinkronisasi file ke /var/www/my-app-runner..."
          sudo mkdir -p /var/www/my-app-runner
          sudo rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            ./ /var/www/my-app-runner/
          sudo chown -R deployer:deployer /var/www/my-app-runner
          sudo chmod -R 755 /var/www/my-app-runner
          echo "✅ Sync selesai!"